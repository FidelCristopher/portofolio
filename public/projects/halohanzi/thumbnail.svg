<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" fill="none">
  <defs>
    <linearGradient id="bgHanzi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e12" />
      <stop offset="50%" stop-color="#1f1118" />
      <stop offset="100%" stop-color="#0e0a0d" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1620" />
      <stop offset="100%" stop-color="#180d13" />
    </linearGradient>
    <linearGradient id="goldRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="kotlinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF" />
      <stop offset="50%" stop-color="#C711E1" />
      <stop offset="100%" stop-color="#E4485D" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" rx="16" fill="url(#bgHanzi)" />

  <!-- Grid Pattern -->
  <path d="M0 50h400M0 100h400M0 150h400M0 200h400M50 0v250M100 0v250M150 0v250M200 0v250M250 0v250M300 0v250M350 0v250" stroke="#f43f5e" stroke-opacity="0.05" stroke-width="1" />

  <!-- Center Card -->
  <g transform="translate(100, 32)">
    <rect width="200" height="135" rx="12" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.4" />
    
    <!-- Header Chips -->
    <rect x="14" y="12" width="56" height="18" rx="5" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="42" y="24" text-anchor="middle" font-family="'GeistMono', monospace" font-size="9" font-weight="700" fill="#fb7185">HSK 1-2+</text>

    <!-- Kotlin Tag -->
    <rect x="76" y="12" width="52" height="18" rx="5" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="102" y="24" text-anchor="middle" font-family="'GeistMono', monospace" font-size="9" font-weight="700" fill="#c084fc">Compose</text>

    <!-- Audio Badge -->
    <rect x="134" y="12" width="52" height="18" rx="5" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="160" y="24" text-anchor="middle" font-family="'GeistMono', monospace" font-size="9" font-weight="700" fill="#34d399">TTS Audio</text>

    <!-- Hanzi & Ruby Pinyin Showcase -->
    <text x="100" y="58" text-anchor="middle" font-family="'GeistMono', monospace" font-size="12" font-weight="500" fill="#fbbf24" letter-spacing="4">nǐ hǎo</text>
    <text x="100" y="98" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="6">你好</text>

    <!-- Karaoke Progress Highlight Bar -->
    <rect x="25" y="114" width="150" height="6" rx="3" fill="#3f1e29" />
    <rect x="25" y="114" width="95" height="6" rx="3" fill="url(#goldRed)" />
  </g>

  <!-- Title & Subtitle -->
  <text x="200" y="198" text-anchor="middle" font-family="'GeistMono', ui-monospace, monospace" font-size="12" font-weight="700" fill="#fecdd3" letter-spacing="2">
    HALOHANZI &bull; MANDARIN LEARNING
  </text>
  <text x="200" y="217" text-anchor="middle" font-family="'GeistSans', sans-serif" font-size="10" fill="#a1a1aa" letter-spacing="0.5">
    Jetpack Compose &bull; Kotlin 2.2 &bull; Interactive Graded Readers &bull; Native TTS
  </text>
</svg>
