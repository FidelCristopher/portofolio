<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" fill="none">
  <defs>
    <linearGradient id="bgMcp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" rx="16" fill="url(#bgMcp)" />

  <!-- Grid Pattern -->
  <path d="M0 50h400M0 100h400M0 150h400M0 200h400M50 0v250M100 0v250M150 0v250M200 0v250M250 0v250M300 0v250M350 0v250" stroke="#71717a" stroke-opacity="0.1" stroke-width="1" />

  <!-- Center Architecture Diagram Graphic -->
  <g transform="translate(60, 48)">
    <!-- MCP Client Box -->
    <rect x="0" y="10" width="85" height="95" rx="8" fill="#18181b" stroke="#38bdf8" stroke-width="1.4" />
    <rect x="0" y="10" width="85" height="22" rx="8" fill="#0369a1" fill-opacity="0.25" />
    <text x="42" y="25" text-anchor="middle" font-family="'GeistMono', monospace" font-size="9" font-weight="700" fill="#38bdf8">MCP Client</text>
    <text x="42" y="52" text-anchor="middle" font-family="'GeistSans', sans-serif" font-size="8" fill="#94a3b8">Claude Desktop</text>
    <text x="42" y="68" text-anchor="middle" font-family="'GeistSans', sans-serif" font-size="8" fill="#94a3b8">Cursor / Pi</text>
    <rect x="15" y="80" width="55" height="15" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
    <text x="42" y="91" text-anchor="middle" font-family="'GeistMono', monospace" font-size="7.5" fill="#38bdf8">JSON-RPC</text>

    <!-- Communication Bridge Stream Lines -->
    <path d="M95 57 L140 57" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 3" />
    <polygon points="135,53 143,57 135,61" fill="#38bdf8" />
    <path d="M140 65 L95 65" stroke="#f97316" stroke-width="1.8" stroke-dasharray="3 3" />
    <polygon points="103,61 95,65 103,69" fill="#f97316" />

    <!-- MCP Server Center Hub -->
    <rect x="145" y="20" width="90" height="75" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.4" />
    <text x="190" y="42" text-anchor="middle" font-family="'GeistMono', monospace" font-size="9" font-weight="700" fill="#f4f4f5">mcp_server.py</text>
    <text x="190" y="58" text-anchor="middle" font-family="'GeistMono', monospace" font-size="7.5" fill="#a1a1aa">IPC Bridge</text>
    <rect x="155" y="68" width="70" height="18" rx="4" fill="#27272a" />
    <text x="190" y="80" text-anchor="middle" font-family="'GeistMono', monospace" font-size="7.5" fill="#34d399">&bull; 127.0.0.1:8080</text>

    <!-- Socket Stream to Blender -->
    <path d="M245 57 L285 57" stroke="#f97316" stroke-width="1.8" stroke-dasharray="3 3" />
    <polygon points="280,53 288,57 280,61" fill="#f97316" />

    <!-- Blender App Target Box -->
    <rect x="290" y="10" width="85" height="95" rx="8" fill="#18181b" stroke="#f97316" stroke-width="1.4" />
    <rect x="290" y="10" width="85" height="22" rx="8" fill="#c2410c" fill-opacity="0.25" />
    <text x="332" y="25" text-anchor="middle" font-family="'GeistMono', monospace" font-size="9" font-weight="700" fill="#f97316">Blender 3D</text>
    <circle cx="332" cy="54" r="14" fill="#1e293b" stroke="#f97316" stroke-width="1.2" />
    <path d="M326 50 L338 54 L326 58 Z" fill="#f97316" opacity="0.85" />
    <text x="332" y="82" text-anchor="middle" font-family="'GeistMono', monospace" font-size="7.5" fill="#f97316">bpy.ops &bull; 3D</text>
    <text x="332" y="93" text-anchor="middle" font-family="'GeistSans', sans-serif" font-size="7.5" fill="#94a3b8">Active Viewport</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="200" y="196" text-anchor="middle" font-family="'GeistMono', ui-monospace, monospace" font-size="12" font-weight="700" fill="#f4f4f5" letter-spacing="2">
    BLENDER DESKTOP BRIDGE MCP
  </text>
  <text x="200" y="215" text-anchor="middle" font-family="'GeistSans', sans-serif" font-size="10" fill="#a1a1aa" letter-spacing="0.5">
    Model Context Protocol &bull; Real-Time Socket IPC for 3D Automation
  </text>
</svg>
