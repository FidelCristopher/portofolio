<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" fill="none">
  <defs>
    <linearGradient id="bgGemini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="socketGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" rx="16" fill="url(#bgGemini)" />

  <!-- Grid Pattern -->
  <path d="M0 50h400M0 100h400M0 150h400M0 200h400M50 0v250M100 0v250M150 0v250M200 0v250M250 0v250M300 0v250M350 0v250" stroke="#71717a" stroke-opacity="0.1" stroke-width="1" />

  <!-- Center Terminal Window Graphic -->
  <g transform="translate(100, 45)">
    <rect width="200" height="120" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <!-- Window Bar -->
    <rect width="200" height="26" rx="10" fill="#27272a" />
    <circle cx="16" cy="13" r="4" fill="#ef4444" opacity="0.8" />
    <circle cx="28" cy="13" r="4" fill="#eab308" opacity="0.8" />
    <circle cx="40" cy="13" r="4" fill="#22c55e" opacity="0.8" />
    <text x="100" y="16" text-anchor="middle" font-family="'GeistMono', monospace" font-size="9" fill="#71717a">ipc_bridge.py</text>
    
    <!-- Code Lines -->
    <text x="16" y="52" font-family="'GeistMono', monospace" font-size="10" fill="#38bdf8">&gt; socket.connect(('127.0.0.1', 8080))</text>
    <text x="16" y="72" font-family="'GeistMono', monospace" font-size="10" fill="#a1a1aa">&gt; bridge.stream_telemetry()</text>
    <text x="16" y="92" font-family="'GeistMono', monospace" font-size="10" fill="#34d399">&gt; [OK] Bidirectional Bridge Online</text>
    <rect x="16" y="104" width="8" height="12" fill="#38bdf8" opacity="0.9" />
  </g>

  <!-- Title & Subtitle -->
  <text x="200" y="200" text-anchor="middle" font-family="'GeistMono', ui-monospace, monospace" font-size="12" font-weight="700" fill="#f4f4f5" letter-spacing="2">
    DESKTOP BRIDGE &amp; PROTOCOL
  </text>
  <text x="200" y="218" text-anchor="middle" font-family="'GeistSans', sans-serif" font-size="10" fill="#a1a1aa" letter-spacing="0.5">
    Real-Time Socket IPC Communication Protocol
  </text>
</svg>
