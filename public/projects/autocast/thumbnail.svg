<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" fill="none">
  <defs>
    <linearGradient id="bgAutoCast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#12101b" />
      <stop offset="100%" stop-color="#07060a" />
    </linearGradient>
    <linearGradient id="cardBgAutoCast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1827" />
      <stop offset="100%" stop-color="#100e19" />
    </linearGradient>
    <linearGradient id="ytRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0033" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" rx="16" fill="url(#bgAutoCast)" />

  <!-- Subtly patterned tech grid -->
  <path d="M0 50h400M0 100h400M0 150h400M0 200h400M50 0v250M100 0v250M150 0v250M200 0v250M250 0v250M300 0v250M350 0v250" stroke="#6366f1" stroke-opacity="0.06" stroke-width="1" />

  <!-- Pipeline Central Diagram -->
  <g transform="translate(45, 36)">
    <!-- Stage 1: LLM Engine -->
    <rect x="0" y="24" width="82" height="70" rx="8" fill="url(#cardBgAutoCast)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="41" cy="46" r="12" fill="#6366f1" fill-opacity="0.2" />
    <path d="M41 38v16M33 46h16" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
    <text x="41" y="74" text-anchor="middle" font-family="'GeistMono', monospace" font-size="8" font-weight="700" fill="#a5b4fc">GEMINI 3.8</text>
    <text x="41" y="85" text-anchor="middle" font-family="'GeistMono', monospace" font-size="7" fill="#64748b">Script Gen</text>

    <!-- Connector Arrow 1 -->
    <path d="M86 59h24" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" />
    <polygon points="110,59 105,56 105,62" fill="#818cf8" />

    <!-- Stage 2: Headless Playwright Synthesis -->
    <rect x="114" y="24" width="82" height="70" rx="8" fill="url(#cardBgAutoCast)" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.4" />
    <rect x="145" y="40" width="20" height="15" rx="3" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.2" />
    <polygon points="152,44 152,51 159,47.5" fill="#38bdf8" />
    <text x="155" y="74" text-anchor="middle" font-family="'GeistMono', monospace" font-size="8" font-weight="700" fill="#7dd3fc">PLAYWRIGHT</text>
    <text x="155" y="85" text-anchor="middle" font-family="'GeistMono', monospace" font-size="7" fill="#64748b">Video Render</text>

    <!-- Connector Arrow 2 -->
    <path d="M200 59h24" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" />
    <polygon points="224,59 219,56 219,62" fill="#ef4444" />

    <!-- Stage 3: YouTube Data API v3 -->
    <rect x="228" y="24" width="82" height="70" rx="8" fill="url(#cardBgAutoCast)" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.4" />
    <rect x="257" y="40" width="24" height="16" rx="4" fill="url(#ytRed)" />
    <polygon points="266,45 266,51 273,48" fill="#ffffff" />
    <text x="269" y="74" text-anchor="middle" font-family="'GeistMono', monospace" font-size="8" font-weight="700" fill="#fca5a5">YOUTUBE V3</text>
    <text x="269" y="85" text-anchor="middle" font-family="'GeistMono', monospace" font-size="7" fill="#64748b">Auto Publish</text>

    <!-- Top Status Badges -->
    <rect x="55" y="0" width="200" height="16" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <circle cx="68" cy="8" r="3" fill="#10b981" />
    <text x="155" y="11" text-anchor="middle" font-family="'GeistMono', monospace" font-size="7.5" font-weight="600" fill="#94a3b8" letter-spacing="1">END-TO-END AUTONOMOUS PIPELINE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="200" y="196" text-anchor="middle" font-family="'GeistMono', ui-monospace, monospace" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="2">
    AUTOCAST &bull; DESKTOP AUTOMATION
  </text>
  <text x="200" y="216" text-anchor="middle" font-family="'GeistSans', sans-serif" font-size="9.5" fill="#94a3b8" letter-spacing="0.5">
    Gemini 3.8 Flash &bull; Playwright Automation &bull; YouTube API v3 &bull; CustomTkinter
  </text>
</svg>
